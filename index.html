<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>AWS SAA-C03 Simulator</title><style>html,body{height:100%;margin:0;background:#eef2f7;font-family:Arial,sans-serif}#loading{height:100%;display:grid;place-items:center;color:#233044;font-size:18px}.box{background:white;border-radius:16px;padding:28px 34px;box-shadow:0 12px 35px rgba(31,46,70,.12);text-align:center}.spin{width:34px;height:34px;border:4px solid #e1e7ef;border-top-color:#ff9900;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{display:block;margin-top:8px;color:#64748b}</style></head><body><div id="loading"><div class="box"><div class="spin"></div>בודק ומטעין את הגרסה העדכנית ביותר...<small id="version"></small></div></div><script>(async()=>{const fail=e=>{document.getElementById('loading').innerHTML='<div class="box"><b>שגיאה בטעינת האפליקציה</b><small>'+String(e.message||e)+'</small></div>'};try{const stamp=Date.now();const r=await fetch('release.json?t='+stamp,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});if(!r.ok)throw new Error('Release manifest unavailable: '+r.status);const release=await r.json();document.getElementById('version').textContent='גרסה '+release.version+' · '+release.questionCount+' שאלות';window.__APP_CHUNKS=[];for(let i=0;i<release.chunks;i++){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=release.path+'/chunk-'+i+'.js?v='+encodeURIComponent(release.version)+'-'+stamp;s.onload=resolve;s.onerror=()=>reject(new Error('Failed loading chunk '+i));document.head.appendChild(s)})}const b=window.__APP_CHUNKS.join('');if(window.__APP_CHUNKS.length!==release.chunks||!b)throw new Error('Application data incomplete');const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const h=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',u))).map(x=>x.toString(16).padStart(2,'0')).join('');if(h!==release.sha256)throw new Error('Integrity check failed');if(!('DecompressionStream'in window))throw new Error('הדפדפן אינו תומך בפענוח האפליקציה. יש להשתמש ב-Chrome או Edge מעודכן.');const stream=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));const text=await new Response(stream).text();document.open();document.write(text);document.close()}catch(e){fail(e)}})();</script></body></html>
